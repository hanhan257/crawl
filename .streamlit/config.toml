[theme]
primaryColor = "#B85C7A"
backgroundColor = "#FAF4F7"
secondaryBackgroundColor = "#F3DCE6"
textColor = "#3D2430"
font = "Outfit"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
# File feed lớn (lọc trùng / lọc title) — đơn vị MB, tối đa ~3GB
maxUploadSize = 3072

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501
