[theme]
primaryColor = "#E879A9"
backgroundColor = "#FFF8FA"
secondaryBackgroundColor = "#FFF0F5"
textColor = "#4A3040"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
# File feed lớn (lọc trùng / lọc title) — đơn vị MB, tối đa ~3GB
maxUploadSize = 3072

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501
