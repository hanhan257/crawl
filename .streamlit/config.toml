[theme]
base = "dark"
primaryColor = "#F2F2F2"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
textColor = "#F5F5F5"
font = "Inter"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
# File feed lớn (lọc trùng / lọc title) — đơn vị MB, tối đa ~3GB
maxUploadSize = 3072

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501
