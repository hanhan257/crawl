[theme]
primaryColor = "#A84363"
backgroundColor = "#FAF7F9"
secondaryBackgroundColor = "#F5E6EC"
textColor = "#2D1F28"
font = "Outfit"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
# File feed lớn (lọc trùng / lọc title) — đơn vị MB, tối đa ~3GB
maxUploadSize = 3072

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501
