[theme]
primaryColor = "#FF7675"
backgroundColor = "#FFFBFB"
secondaryBackgroundColor = "#FFA1A1"
textColor = "#1A1A1A"
font = "Inter"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
# File feed lớn (lọc trùng / lọc title) — đơn vị MB, tối đa ~3GB
maxUploadSize = 3072

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501
