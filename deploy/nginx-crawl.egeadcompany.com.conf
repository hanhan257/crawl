# Nginx — https://crawl.egeadcompany.com → Streamlit :8501
# AlmaLinux: /etc/nginx/conf.d/crawl.egeadcompany.com.conf
#
# Cài:
#   sudo dnf -y install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-crawl.egeadcompany.com.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl enable --now nginx
#   sudo certbot --nginx -d crawl.egeadcompany.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name crawl.egeadcompany.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
